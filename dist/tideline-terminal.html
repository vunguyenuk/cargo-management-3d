<title>Tideline Terminal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: terminal operating system shell. Dark module rail on the left, a live 3D quay in late-afternoon light behind,
   crisp work panels docked over it. One committed light chrome; the warmth lives in the scene. */
:root{
  --bg:#d9c3a3;
  --rail:#1f1b22; --rail-ink:#a99fae; --rail-on:#ffffff;
  --ink:#1c191f; --ink-2:#57525b; --ink-3:#8a858e;
  --panel:rgba(252,250,247,.96); --panel-solid:#fcfaf7; --sunken:#f2eee9;
  --line:rgba(40,28,30,.12); --line-2:rgba(40,28,30,.07);
  --accent:#d4501d; --accent-ink:#ffffff; --accent-soft:#fbe5d8;
  --sea:#1a5f6f; --sea-soft:#dbeaee;
  --good:#1c744a; --good-soft:#dbeee3;
  --warn:#8a5a00; --warn-soft:#f8e6ba;
  --bad:#b0251d; --bad-soft:#f9dcd9;
  --vio:#5a45b5; --vio-soft:#e7e2f7;
  --idle:#6a646d; --idle-soft:#ebe7ea;
  --shadow:0 10px 30px -14px rgba(50,24,14,.5),0 1px 3px rgba(50,24,14,.12);
  --r:10px; --railw:64px;
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 13px/1.35 var(--f-body);overflow:hidden}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{position:relative;height:100%;min-height:460px;overflow:hidden;-webkit-user-select:none;user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;filter:contrast(1.05) saturate(1.06)}
#gl.drag{cursor:grabbing}#gl.hot{cursor:pointer}
.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(110% 80% at 0% 0%,rgba(255,186,104,.26),transparent 58%);mix-blend-mode:screen}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;white-space:nowrap;font:700 11px/1 var(--f-mono);padding:5px 7px;border-radius:5px;will-change:transform}
.tag span{font:500 11px/1 var(--f-body);margin-left:6px;opacity:.88}
.tag.sel{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 14px -6px rgba(120,36,6,.8)}
.tag.hov{background:rgba(28,25,31,.9);color:#fff}
.tag.ves{background:var(--panel-solid);color:var(--ink);border:1px solid var(--line);box-shadow:0 6px 14px -8px rgba(50,24,14,.6)}
.panel{background:var(--panel);border:1px solid rgba(255,255,255,.7);outline:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow)}
.mono{font-family:var(--f-mono);font-weight:500;letter-spacing:-.01em}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cap{font:700 10px/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

/* module rail */
.rail{position:absolute;left:0;top:0;bottom:0;width:var(--railw);background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:2px;z-index:8}
.rail .mark{width:34px;height:34px;margin-bottom:12px;flex:none}
.rail button{width:52px;height:52px;border:0;background:none;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--rail-ink);font:600 10px/1 var(--f-body)}
.rail button:hover{color:var(--rail-on);background:rgba(255,255,255,.06)}
.rail button.on{color:var(--rail-on);background:var(--accent)}
.rail .sp{flex:1}
.rail small{font:600 9px/1.25 var(--f-body);color:#7d7482;text-align:center;letter-spacing:.04em;text-transform:uppercase}

/* top bar */
.top{position:absolute;top:10px;left:calc(var(--railw) + 12px);right:12px;height:48px;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;z-index:6}
.crumb{display:flex;align-items:baseline;gap:8px;min-width:0;white-space:nowrap;flex:0 1 auto}
.crumb b{font:800 16px/1 var(--f-display);letter-spacing:-.015em}
.crumb span{color:var(--ink-2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.crumb span::before{content:"/";margin-right:8px;color:var(--ink-3)}
.search{position:relative;flex:1 1 230px;max-width:320px;min-width:0;display:flex;align-items:center;gap:8px;height:32px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--ink);-webkit-user-select:text;user-select:text}
.search input::placeholder{color:var(--ink-3)}
.search kbd{font:500 10.5px var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink-3)}
.pop{position:absolute;top:38px;padding:5px;display:flex;flex-direction:column;gap:1px;background:var(--panel-solid);z-index:20}
.results{left:0;right:0}
.pop button{display:flex;align-items:center;gap:9px;border:0;background:none;text-align:left;padding:7px 8px;border-radius:6px}
.pop button:hover,.pop button:focus-visible{background:var(--sunken)}
.pop small{color:var(--ink-2);margin-left:auto;white-space:nowrap}
.grow{flex:1 1 0}
.pick{display:flex;align-items:center;gap:6px;height:32px;padding:0 2px 0 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
.pick span{font:700 10px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.pick select{border:0;background:none;font-weight:600;height:28px;border-radius:5px;max-width:150px}
.live{display:flex;align-items:center;gap:7px;height:28px;padding:0 9px;border-radius:6px;background:var(--good-soft);color:var(--good);font-weight:600;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.8s infinite}
.live b{color:var(--ink);font:700 12.5px var(--f-mono);font-variant-numeric:tabular-nums}
.live.paused{background:var(--idle-soft);color:var(--idle)}.live.paused i{animation:none}
@keyframes pulse{50%{opacity:.3}}
.speed{display:flex;padding:2px;border-radius:7px;background:var(--sunken);border:1px solid var(--line-2)}
.speed button{border:0;background:none;min-width:30px;height:26px;border-radius:5px;font:700 11.5px var(--f-mono);color:var(--ink-2)}
.speed button.on{background:#fff;color:var(--accent);box-shadow:0 1px 2px rgba(50,24,14,.25)}
.bell{position:relative}
.bell>button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:7px;display:grid;place-items:center;color:var(--ink-2)}
.bell u{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:#fff;font:700 10px/16px var(--f-mono);text-align:center;text-decoration:none}
.feed{right:0;width:330px;max-height:340px;overflow:auto}
.feed button{align-items:flex-start}
.feed button b{font:500 10.5px var(--f-mono);color:var(--ink-3);padding-top:1px}
.feed button span{flex:1;white-space:normal}
.shift{display:flex;flex-direction:column;padding-left:12px;border-left:1px solid var(--line);white-space:nowrap}
.shift b{font-weight:700;font-size:12.5px}.shift span{color:var(--ink-2);font-size:11px}

/* KPI row (live) */
.kpis{position:absolute;top:70px;left:calc(var(--railw) + 12px);display:flex;gap:8px;z-index:3}
.kpi{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 9px;min-width:170px}
.kpi .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.kpi:nth-child(2) .ic{background:var(--sea-soft);color:var(--sea)}
.kpi:nth-child(3) .ic{background:var(--warn-soft);color:var(--warn)}
.kpi:nth-child(4) .ic{background:var(--bad-soft);color:var(--bad)}
.kpi small{display:block;color:var(--ink-2);font-size:11.5px}
.kpi strong{font:800 21px/1.05 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi strong u{text-decoration:none;font:600 11.5px var(--f-body);color:var(--ink-2);margin-left:3px;letter-spacing:0}
.kpi em{display:block;font-style:normal;color:var(--ink-3);font-size:11px;white-space:nowrap}
.kpi .d{font:600 11px var(--f-mono);color:var(--good);margin-left:6px;vertical-align:3px}

/* right column: camera controls + inspector */
.right{position:absolute;top:70px;right:12px;bottom:258px;display:flex;gap:8px;align-items:flex-start;z-index:5;pointer-events:none}
.right>*{pointer-events:auto}
#app:not(.m-live) .right{bottom:12px}
.ctl{display:flex;flex-direction:column;padding:3px;gap:1px}
.ctl button{width:30px;height:30px;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:var(--ink-2)}
.ctl button:hover{background:var(--sunken);color:var(--accent)}
.ctl hr{width:18px;border:0;border-top:1px solid var(--line);margin:2px auto}
.insp{width:326px;max-height:100%;overflow:auto;padding:13px}
#app:not(.m-live) .insp.home{display:none}
.ihead{display:flex;gap:10px;align-items:center}
.iicon{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.iicon svg{width:21px;height:21px}
.ititle{min-width:0;flex:1}
.ititle small{display:block;font:700 10px/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.ititle b{display:block;font:700 16.5px/1.2 var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.ititle b.mono{font:700 15px/1.25 var(--f-mono)}
.ititle span{display:block;color:var(--ink-2);font-size:11.5px}
.iact{display:flex;gap:3px;align-self:flex-start}
.iact button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-2)}
.iact button svg{width:14px;height:14px}
.iact button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.istat{display:flex;align-items:center;gap:7px;margin:11px 0 8px;color:var(--ink-2);font-size:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-weight:600;font-size:11.5px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.idle{background:var(--idle-soft);color:var(--idle)}.pill.sea{background:var(--sea-soft);color:var(--sea)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.vio{background:var(--vio-soft);color:var(--vio)}
.bar{height:6px;border-radius:3px;background:var(--idle-soft);overflow:hidden;flex:1;min-width:40px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--good);transition:width .4s}
.bar.accent i{background:var(--accent)}
.prog{display:flex;align-items:center;gap:10px;font:500 11.5px var(--f-mono);color:var(--ink-2);margin-bottom:6px}
.sec{margin:12px 0 2px}
.kv{margin:0;display:grid}
.kv div{display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-top:1px solid var(--line-2)}
.kv dt{color:var(--ink-2)}.kv dd{margin:0;font-weight:600;text-align:right;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.kv dd.mono{font-weight:500}.kv dd a,.lnk{color:var(--sea);text-decoration:none;cursor:pointer}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.btn{height:30px;padding:0 11px;border-radius:7px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:rgba(40,28,30,.3)}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.pri:hover{background:#bd4517}
.btn.danger{color:var(--bad)}
.banner{margin:10px 0 0;padding:8px 10px;border-radius:7px;background:var(--sea-soft);color:var(--sea);font-size:12px;font-weight:600}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.blocks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:10px 0 2px;border-top:1px solid var(--line-2)}
.blocks div{text-align:center;font:500 10.5px var(--f-mono);color:var(--ink-2)}
.blocks s{display:flex;align-items:flex-end;height:36px;border-radius:4px;background:var(--idle-soft);overflow:hidden;margin-bottom:4px;text-decoration:none}
.blocks s i{display:block;width:100%;background:var(--accent)}
.blocks b{display:block;color:var(--ink);font-weight:700}
.note{margin:10px 0 0;color:var(--ink-3);font-size:11px}

/* bottom panels (live) */
.tracker{position:absolute;left:calc(var(--railw) + 12px);bottom:12px;width:min(660px,calc(100% - var(--railw) - 36px - 396px));padding:13px 15px 11px;display:flex;gap:14px;align-items:stretch;z-index:3}
.tr-main{flex:1;min-width:0}
.tr-head{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.tr-head svg{color:var(--accent)}
.tr-head b{font:700 14px var(--f-display)}
.tr-head span{margin-left:auto;color:var(--ink-2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;position:relative}
.step{flex:1;min-width:0;text-align:center;position:relative}
.step::before{content:"";position:absolute;top:12px;left:-50%;width:100%;height:3px;background:var(--idle-soft)}
.step:first-child::before{display:none}
.step.done::before,.step.now::before{background:var(--accent)}
.step i{position:relative;z-index:1;display:grid;place-items:center;width:26px;height:26px;margin:0 auto 6px;border-radius:50%;background:#e6e0e3;color:var(--ink-3)}
.step i svg{width:13px;height:13px}
.step.done i{background:var(--accent);color:var(--accent-ink)}
.step.now i{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 4px var(--accent-soft)}
.step b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step span{display:block;font:500 10.5px var(--f-mono);color:var(--ink-2);white-space:nowrap}
.now-card{width:206px;flex:none;border-radius:8px;background:var(--sunken);padding:9px 11px;display:flex;flex-direction:column;gap:3px;justify-content:center}
.now-card b{font:700 12.5px var(--f-mono)}
.now-card span{color:var(--ink-2);font-size:11.5px}
.lists{position:absolute;right:12px;bottom:12px;width:384px;height:234px;display:flex;flex-direction:column;padding:8px 4px 4px 10px;z-index:3}
.tabs{display:flex;align-items:center;gap:2px;padding-right:6px;margin-bottom:5px}
.tabs button{border:0;background:none;height:26px;padding:0 9px;border-radius:6px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tabs button u{text-decoration:none;font:500 10.5px var(--f-mono);margin-left:5px;color:var(--ink-3)}
.tabs button.on{background:var(--sunken);color:var(--ink)}
.tabs button.on u{color:var(--accent)}
.rows{overflow:auto;flex:1;padding-right:6px}
.row{display:grid;grid-template-columns:92px minmax(0,1fr) auto 44px;align-items:center;gap:9px;width:100%;border:0;background:none;text-align:left;padding:6px 6px;border-top:1px solid var(--line-2);border-radius:0}
button.row:hover{background:var(--sunken)}
.row.on{background:var(--accent-soft)}
.row b{font:700 12px var(--f-mono);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row b+small{color:var(--ink-3);font-size:10.5px;display:block}
.row>span{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.row em{font:500 11px var(--f-mono);font-style:normal;color:var(--ink-2);text-align:right}
.row.ev{grid-template-columns:44px minmax(0,1fr)}
.row.ev>span{white-space:normal;color:var(--ink)}
.row.ev b{font-weight:500;color:var(--ink-3)}
#app:not(.m-live) .kpis,#app:not(.m-live) .tracker,#app:not(.m-live) .lists{display:none}

/* work panel (modules) */
.work{position:absolute;left:calc(var(--railw) + 12px);top:70px;bottom:12px;width:min(880px,calc(100% - var(--railw) - 36px - 372px));display:flex;flex-direction:column;z-index:4;overflow:hidden}
.w-head{display:flex;align-items:center;gap:12px;padding:12px 14px 10px;border-bottom:1px solid var(--line-2);flex:none}
.w-head h1{margin:0;font:700 17px/1.1 var(--f-display);letter-spacing:-.01em}
.w-head p{margin:0;color:var(--ink-2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.w-head .x{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:6px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.w-body{flex:1;min-height:0;overflow:auto;padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:8px;overflow:hidden;flex:none}
.stat{background:var(--panel-solid);padding:9px 11px}
.stat small{display:block;color:var(--ink-2);font-size:11px;white-space:nowrap}
.stat b{display:block;font:800 19px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.stat em{display:block;font-style:normal;color:var(--ink-3);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quay{display:flex;align-items:center;gap:8px;flex:none}
.quay .cap{writing-mode:vertical-rl;transform:rotate(180deg)}
.qv{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:7px;border:1px solid var(--sea);background:var(--sea-soft);text-align:left}
.qv b{font:700 11.5px var(--f-mono);color:var(--sea)}
.qv span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.qv em{font:500 11px var(--f-mono);font-style:normal;color:var(--ink-2)}
.qv.off{border:1px dashed var(--line);background:none;color:var(--ink-3)}.qv.off b{color:var(--ink-3)}
.ymap{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
.blk{border:1px solid var(--line);border-radius:8px;padding:8px 9px 6px;background:#fff}
.blk-h{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.blk-h b{font:700 13px var(--f-display)}
.blk-h span{color:var(--ink-2);font:500 11px var(--f-mono)}
.blk-h button{margin-left:auto;border:0;background:none;display:flex;align-items:center;gap:6px;font:700 11px var(--f-mono);color:var(--ink-2);padding:2px;border-radius:5px}
.lane{font:500 10.5px var(--f-mono);color:var(--ink-3);border:1px dashed var(--line);border-radius:4px;padding:2px 6px;margin-bottom:4px}
.cells{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.c{height:21px;border:0;border-radius:4px;background:var(--sunken);font:700 11px/1 var(--f-mono);color:var(--ink-3);position:relative;padding:0}
.c.t1{background:#fbe1cf;color:#8a4a22}.c.t2{background:#f5bf9b;color:#73360f}.c.t3{background:#ea9460;color:#fff}.c.t4{background:#d4581f;color:#fff}
.c.lock{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.5) 0 3px,transparent 3px 7px)}
.c.on{outline:2px solid var(--ink);outline-offset:1px;z-index:1}
.c i{position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 1.5px #fff}
.bays{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:3px;font:500 10px var(--f-mono);color:var(--ink-3);text-align:center}
.keyrow{display:flex;gap:12px;align-items:center;color:var(--ink-2);font-size:11.5px;flex-wrap:wrap;flex:none}
.keyrow i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.bay{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;flex:none}
.bay.empty{color:var(--ink-3);border-style:dashed;background:none;text-align:center;padding:16px}

    if(v){const a=pos(v.tArr),e=etdOf(v),w=Math.max(1,pos(e)-a);bars+=`<button class="sc-bar" data-go="${key(v)}" style="left:${a.toFixed(2)}%;width:${w.toFixed(2)}%"><u style="width:${Math.round(v.done/v.planned*100)}%"></u><span>${esc(v.name)} · ${v.mode==='discharge'?'discharge':'load'} ${v.done}/${v.planned}</span></button>`;
      calls.push([v,null,b,v.tArr,e]);}
    const n=b.next,ns=v?etdOf(v)+95:b.nextAt,ne=ns+60+n.planned*13.5;if(pos(ns)<99)bars+=`<div class="sc-bar next" style="left:${pos(ns).toFixed(2)}%;width:${Math.max(1,pos(ne)-pos(ns)).toFixed(2)}%"><span>${esc(n.name)} · ${n.mode==='discharge'?'discharge':'load'} ${n.planned}</span></div>`;
    calls.push([null,n,b,ns,ne]);
    h+=`<div class="sc-row"><b>${b.id}</b><div class="sc-lane">${grid}${bars}</div></div>`;}
  h+=`</div><div class="tbl simple" style="flex:none;min-height:0"><div class="tin" style="--cols:1.4fr 1.2fr .6fr .9fr .6fr .6fr .7fr .9fr;min-width:700px"><div class="thead">${['Vessel','Line','Berth','Operation','ATA / ETA','ETD','Moves','Status'].map((x,i)=>`<button class="${i===6?'num':''}" tabindex="-1">${x}</button>`).join('')}</div>`;
  for(const [v,n,b,ts,te] of calls){const o=v||n;h+=`<${v?'button':'div'} class="tr"${v?` data-go="${key(v)}"`:''}><span class="mono">${esc(o.name)}<small>voy. ${o.voy}</small></span><span>${esc(o.line.n)}</span><span>${b.id}</span><span>${o.mode==='discharge'?'Discharge':'Load'}</span><span class="num">${clockAt(ts)}</span><span class="num">${clockAt(te)}</span><span class="num">${v?v.done+'/'+v.planned:'0/'+n.planned}</span><span>${pill(v?v.status:'Expected')}</span></${v?'button':'div'}>`;}
  h+='</div></div>';
  let v=tracked&&!tracked.dead?tracked:berths[0].vessel||berths[1].vessel;
  if(!v)return h+'<div class="bay empty">No vessel alongside. The bay plan opens when the next call berths.</div>';
  h+=`<div class="bay"><div class="bay-h"><b>Bay plan · ${esc(v.name)}</b><span>Deck stow by bay, seen from astern · quay on the right · bow bays first</span></div><div class="bplan">`;
  for(let ci=5;ci>=0;ci--){const cl=v.cols[ci],cr=v.berth.cranes.find(c=>!c.idle&&c.col===ci);let n=0;
    let g='';for(let t=MAXT-1;t>=0;t--)for(let r=0;r<6;r++){const x=cl.stacks[r].items[t];if(x)n++;g+=x?`<button class="vb${x===sel?' on':''}" style="${boxCss(x)}" data-go="${key(x)}" title="${x.id}"></button>`:'<i class="vb none"></i>';}
    h+=`<div class="vbay"><div class="vb-h"><b>Bay ${cl.bay}</b><span>${n}/24</span>${cr?pill(cr.id):ci===2||ci===3?'<span class="pill idle">Stays on board</span>':''}</div><div class="g">${g}</div></div>`;}
  return h+'</div></div>';
}
/* gate */
function gateHTML(){
  const act2=appts.filter(a=>a.status==='At gate'||a.status==='In terminal'),bk=appts.filter(a=>a.status==='Booked').sort((a,b)=>(b.user-a.user)||a.t-b.t),dn=appts.filter(a=>a.status==='Completed'||a.status==='Cancelled').reverse();
  const avg=stats.turn.reduce((a,b)=>a+b,0)/stats.turn.length;
  let h=`<div class="stats">${stat('Trucks on site',act2.length,'external hauliers')}${stat('Average turn',avg.toFixed(1)+' min','last '+stats.turn.length+' trucks')}${stat('Gate transactions',stats.gateDone,'this shift')}${stat('Booked ahead',bk.length,'appointments waiting')}${stat('In lane',trucks.filter(t=>t.active&&t.status==='Gate check').length,'at the in-gate now')}${stat('Out lane',trucks.filter(t=>t.active&&t.status==='Gate out').length,'at the out-gate now')}</div>`;
  h+=`<div class="tbl simple"><div class="tin" style="--cols:.8fr 1.3fr 1fr 1.25fr .9fr .9fr .6fr;min-width:700px"><div class="thead">${['Appointment','Haulier','Type','Container','Window','Status','Turn'].map((x,i)=>`<button class="${i===6?'num':''}" tabindex="-1">${x}</button>`).join('')}</div><div class="tscroll">`;
  for(const a of [...act2,...bk,...dn]){const live=a.truck&&a.truck.active&&a.truck.appt===a&&(a.status==='At gate'||a.status==='In terminal'),tgt=live?a.truck:(a.box&&!a.box.dead?a.box:null);
    h+=`<${tgt?'button':'div'} class="tr"${tgt?` data-go="${key(tgt)}"`:''}><span class="mono">${a.id}${a.user?'<small>Booked by you</small>':''}</span><span>${esc(a.haul)}<small>${a.plate}</small></span><span>${a.type}</span><span class="mono">${a.box?a.box.id:'<span style="color:var(--ink-3);font-family:var(--f-body)">Assigned at gate</span>'}</span><span class="num" style="text-align:left">${clockAt(a.t)}–${clockAt(a.t+100)}</span><span>${pill(a.status)}</span><span class="num">${a.turn?a.turn.toFixed(1)+' min':'—'}</span></${tgt?'button':'div'}>`;}
  return h+`</div><div class="tfoot">To book a truck for a specific container, select it and choose “Book truck pick-up”.</div></div></div>`;
}

/* ---------- periodic HUD refresh ---------- */
let lastUI=0,occ0=null,modT=0;
function uiTick(force){
  const now=performance.now();if(!force&&now-lastUI<300)return;lastUI=now;
  $('#clock').textContent=clockAt(simT);
  if(sel&&(sel.dead||sel.active===false))return select(null);
  inspEl.classList.toggle('home',!sel);setH(inspEl,card(sel));
  const bn=$('#bellN');bn.hidden=!unread;bn.textContent=unread>9?'9+':unread;
  if(!$('#feed').hidden)setH($('#feed'),events.slice(0,12).map(x=>`<button data-go="${x.ent&&!x.ent.dead?key(x.ent):''}"><b>${x.t}</b><span>${esc(x.text)}</span></button>`).join('')||'<button disabled>No activity yet.</button>');
  const lg=$('#legend');lg.hidden=colorBy==='natural';if(colorBy!=='natural')setH(lg,`<span class="cap">${$('#colorby').selectedOptions[0].textContent}</span>`+LEGEND[colorBy].map(([l,h])=>`<span><i style="background:${hexCss(h)}"></i>${l}</span>`).join(''));
  if(mode==='live'){
    const occ=yard.count();if(occ0===null)occ0=occ;const d=(occ-occ0)*2;
    setH($('#k1'),Math.round(occ/yard.cap*100)+'<u>%</u>'+(d?`<span class="d">${d>0?'+':''}${d}</span>`:''));$('#k1s').textContent=`${(occ*2).toLocaleString()} / ${(yard.cap*2).toLocaleString()} TEU`;
    while(stats.moves.length&&stats.moves[0]<simT-200)stats.moves.shift();
    setH($('#k2'),(stats.moves.length/4*3).toFixed(1)+'<u>moves/h</u>');$('#k2s').textContent=`per crane · ${stats.total} lifts this shift`;
    const tt=stats.turn.reduce((a,b)=>a+b,0)/stats.turn.length;setH($('#k3'),tt.toFixed(1)+'<u>min</u>');$('#k3s').textContent=`last ${stats.turn.length} hauliers · gate to gate`;
    const yf=yardFigures();setH($('#k4'),yf.hold+'<u>boxes</u>');$('#k4s').textContent=`${yf.reef} reefers · ${yf.dg} dangerous goods`;
    setH(trackEl,trackerHTML());
    const q=cranes.filter(c=>!c.idle).length;
    setH(tabsEl,[['berths','Berths',berths.filter(b=>b.vessel).length+'/2'],['cranes','Cranes',q+'/'+cranes.length],['trucks','Trucks',trucks.filter(t=>t.active).length],['feed','Activity',events.length]].map(([k,n,c])=>`<button role="tab" data-t="${k}" aria-selected="${tab===k}" class="${tab===k?'on':''}">${n}<u>${c}</u></button>`).join('')+'<button class="pmin" data-min="lists" aria-label="Hide equipment and activity"><svg class="i" viewBox="0 0 20 20"><path d="M5 10h10"/></svg></button>');
    setH(rowsEl,rowsHTML());
  }else if(force||now-modT>(mode==='cargo'?1500:600)){modT=now;
    if(mode==='yard')setH($('#m-all'),yardHTML());else if(mode==='vessels')setH($('#m-all'),vesselsHTML());else if(mode==='gate')setH($('#m-all'),gateHTML());else if(mode==='cargo')cargoRefresh(false);}
}
/* search, bell, colour, speed */
const qEl=$('#q'),resEl=$('#results');
function search(){const s=qEl.value.trim().toLowerCase().replace(/\s+/g,'');if(!s){resEl.hidden=true;return;}const out=[];
  for(const e of ents){if(e.active===false)continue;if((e.label+' '+(e.line?e.line.n:'')).toLowerCase().replace(/\s+/g,'').includes(s))out.push(e);if(out.length>=6)break;}
  if(out.length<6)for(const b of boxAt){if(b&&b.id.toLowerCase().replace(/\s+/g,'').includes(s)){out.push(b);if(out.length>=6)break;}}
  resEl._list=out;resEl.innerHTML=out.length?out.map((e,i)=>`<button data-i="${i}">${svg(e.kind)}<b class="mono">${esc(e.label)}</b><small>${esc(statusOf(e))}</small></button>`).join(''):'<button disabled>No match. Try QC-02, TT-07 or a container number.</button>';resEl.hidden=false;}
qEl.addEventListener('input',search);qEl.addEventListener('focus',search);
qEl.addEventListener('keydown',e=>{if(e.key==='Escape'){qEl.blur();resEl.hidden=true;}if(e.key==='Enter'&&resEl._list&&resEl._list[0]){select(resEl._list[0],true);resEl.hidden=true;qEl.blur();}});
resEl.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-i]');if(b){e.preventDefault();select(resEl._list[+b.dataset.i],true);resEl.hidden=true;qEl.blur();}});
qEl.addEventListener('blur',()=>setTimeout(()=>{resEl.hidden=true;},120));
$('#bell').addEventListener('click',()=>{const f=$('#feed');f.hidden=!f.hidden;$('#pmenu').hidden=true;unread=0;uiTick(true);});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.bell')){$('#feed').hidden=true;$('#pmenu').hidden=true;}});
$('#colorby').addEventListener('change',e=>{colorBy=e.target.value;repaintAll();modT=0;uiTick(true);});
addEventListener('keydown',e=>{const tg=e.target.tagName;if(e.key==='/'&&tg!=='INPUT'){e.preventDefault();qEl.focus();}else if((e.key==='h'||e.key==='H')&&tg!=='INPUT'&&tg!=='SELECT'&&!e.metaKey&&!e.ctrlKey&&!e.altKey){const hide=!HID.has('all');setPanel('all',!hide);if(hide)toast('Panels hidden. Press H or use the panels button to bring them back.');}
  else if(e.key==='Escape'&&tg!=='INPUT'){if(HID.has('all'))setPanel('all',true);else if(sel)select(null);else if(mode!=='live')setMode('live');}});
let speed=1;document.querySelector('.speed').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;speed=+b.dataset.sp;[...b.parentNode.children].forEach(x=>x.classList.toggle('on',x===b));$('#live').classList.toggle('paused',!speed);$('#live span').textContent=speed?'Live':'Paused';});

/* ---------- frame loop ---------- */
const lr=new T.Vector3().crossVectors(V(0,1,0),SUN).normalize(),lu=new T.Vector3().crossVectors(SUN,lr).normalize(),_c=V(0,0,0);let sunS=0;
function shadowFit(){const d=cur.dist*narrow,S=d<150?95:d<260?150:d<430?215:300;if(S!==sunS){sunS=S;const c=sun.shadow.camera;c.left=-S;c.right=S;c.top=S;c.bottom=-S;c.updateProjectionMatrix();}
  const tx=2*S/SM;_c.set(cur.tx,0,cur.tz);const a=_c.dot(lr),b=_c.dot(lu);_c.addScaledVector(lr,Math.round(a/tx)*tx-a).addScaledVector(lu,Math.round(b/tx)*tx-b);
  sun.target.position.copy(_c);sun.position.copy(_c).addScaledVector(SUN,560);}
let last=performance.now(),hovT=0,dwT=0,fN=0,fT=0;
function frame(now){
  requestAnimationFrame(frame);
  if(++fN>30&&fN<=120){fT+=now-last;if(fN===120&&fT/90>30&&pxr>Math.max(1,Math.min(DPR,2))){pxr=Math.max(1,Math.min(DPR,2));renderer.setPixelRatio(pxr);resize();}}
  const rdt=Math.min(.1,(now-last)/1000);last=now;let rem=rdt*speed;while(rem>1e-6){const d=Math.min(1/30,rem);step(d);rem-=d;}
  uT.value+=rdt*(speed?1:.25);
  for(const c of cranes){c.sync();if(c.kind==='sts')syncBoom(c);}
  for(const t of trucks)t.sync();
  for(const p of peds)p.sync(rdt);
  tug.position.set(Math.sin(simT*.018)*260,0,-92+Math.sin(simT*.05)*6);tug.rotation.y=Math.cos(simT*.018)>0?0:Math.PI;
  if(colorBy==='dwell'&&now-dwT>20000){dwT=now;repaintAll();}
  if(dirtyC){CIM.instanceMatrix.needsUpdate=true;dirtyC=false;}
  if(sel&&follow){const f=sel.frame();view.tx=f.x;view.tz=f.z;}
  const k=1-Math.exp(-rdt*8);for(const key2 in view)cur[key2]=lerp(cur[key2],view[key2],k);shiftC=lerp(shiftC,shiftT,k);applyCam();shadowFit();
  if(sel&&brk){const f=sel.frame();brk.position.set(f.x,f.y,f.z);brk.rotation.y=f.rot;}
  if(hoverAt&&!ptrs.size&&now-hovT>70){hovT=now;hov=pickAt(hoverAt[0],hoverAt[1]);canvas.classList.toggle('hot',!!hov);}
  place(tagSel,sel,sel?`${esc(sel.label)}<span>${esc(statusOf(sel))}</span>`:'');
  place(tagHov,hov&&hov!==sel&&hov.kind!=='vessel'?hov:null,hov?esc(hov.label):'');
  berths.forEach((b,i)=>place(tagV[i],b.vessel&&b.vessel!==sel?b.vessel:null,b.vessel?`${esc(b.vessel.name)}<span>${esc(b.vessel.status)}${b.vessel.phase==='work'?' '+b.vessel.done+'/'+b.vessel.planned:''}</span>`:''));
  uiTick(false);renderer.render(scene,cam);
}
new ResizeObserver(resize).observe(app);resize();applyPanels();
for(let i=0;i<1500;i++)step(.05);
uiTick(true);requestAnimationFrame(frame);
})();
</script>
